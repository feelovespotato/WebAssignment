<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="C:\Users\Pravineesh\WebAssignment\src\assets\styles\LoginPage.css">
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="">
<title>Welcome to Pokka!</title>
</head>

<body>
<main class="container">
    <div class="login">
<header>
    <h1> <link rel="icon" type="image/png" href=""> Pokka </h1>     

    <h2> Welcome back to Pokka! </h2>
<p class="description">
        Please sign in to continue to your Pokka account.
    </p>
</header>

<form action="#" method:"post">
    <label for ="email address"> Email Address </label>
    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

       

    <label for="password"> Password</label>
    <input
        type="password"
        id="password"
        placeholder="Password"
        required>

         <a href="#" class="forgot"> Forgot your Password? </a>

    <label for="pin"> 4 Digit Pin Code</label>
    <input
        type="text"
        id="pin"
        placeholder="4 Digit Pin Code"
        maxlength="4"
        pattern="[0-9]"
        inputmode="numeric"
        oninput="this.value = this.value.replace(/[^0-9]/g,'')"
        required>
    
    <div class="remember-selection">

        <label class="remember">
            <input type="checkbox">
            Remember My ID
        </label>

        
       </div>
        
       <button type="submit" class="login-button">
        Login
       </button>
</form>

<p class="signup">
    Don't have an account? 
    <a href="#"> Join us! </a>
</p>
<a href="index.html" class:"home-button">

</a>
    </div>
</main>

</body>
</html>
