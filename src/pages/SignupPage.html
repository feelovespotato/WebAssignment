<body>
 <nav class="navbar">

            Login

        <a href="SignupPage.html" class="signupButton">
            Sign Up
        </a>

    </div>

<main class="container">
    <div class="signup">
<header>

 <h2> Join the Pokka Family to enjoy endless benefits! </h2>
<p class="description">
    Please fill up the information below to register your Pokka account. 
</p>
</header>

<form action="#" method="post">
     <label for ="email address"> Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

        <label for ="First Name"> First Name</label>
        <input
            type="text"
            id="First Name"
            placeholder="First Name"
            required>

        <label for ="Last Name"> Last Name</label>
        <input 
            type="text"
            id="Last Name"
            placeholder="Last Name">
        
        <label for ="Mobile Number"> Mobile Number </label>
        <input
            type="tel"
            id="Mobile Number"
            placeholder="Mobile Number"
            required>
        
        <label for="password"> Password </label>
        <div class="passwordContainer">
        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <i class="fa-solid fa-eye-slash" id="togglePassword"></i>
        </div>

        <label for ="confirm password"> Confirm Password </label>
        <div class="passwordContainer">
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your Password"
            required>

        <i class="fa-solid fa-eye-slash" id="toggleConfirmPassword"></i>
        </div>

        <label for="4 digit pin code"> A 4-digit Unique Pin Code</label>
        <input
            type="text"
            id="pin"
            placeholder="A 4-digit Pin. Yours alone."
            maxlength="4"
            pattern="[0-9]"
            inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            required>

<div class="Signup-options">
        <button type="submit" class="SignupButton">
            Submit
        </button>
</div>
    </form>

    <p class="SignupFooter"> Already have an account? <a href="LoginPage.html"> Login </a></p>
    </div>
</main>
