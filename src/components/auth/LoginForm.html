<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="src/assets/styles/LoginForm.css">
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="">
<title>Welcome to Pokka!</title>
</head>

<body>
 
    <form>

    <label for ="email address"> Email Address </label>
    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

    <label for="password"> Password</label>
    <input
        type="password"
        id="password"
        placeholder="Password"
        required>

    <label for="pin"> 4 Digit Pin Code</label>
    <input
        type="pin"
        id="pin"
        placeholder="4 Digit Pin Code"
        minlength="4"
        maxlength="4"
        required>
    
    <div class="login-options">

        <label class="remember">
            <input type="checkbox">
            Remember My ID
        </label>

        <a href="#"> Forgot your Password? </a>
       </div>
        
       <button type="submit" class="loginButton">
        Login
       </button>
</form>
</body>
</html>
