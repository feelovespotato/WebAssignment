<!-- Contact Section -->
<section id="contact">
    <div class="container">
        <div class="section-header animate-fade-up">
            <span class="section-eyebrow">Let's talk</span>
            <h2 class="section-title">Contact Me</h2>
        </div>
        <div class="contact-grid">
            <div class="contact-info animate-fade-up">
                <h3>Let's collaborate</h3>
                <p>Feel free to reach out directly or fill out the form.</p>
                <div class="info-details">
                    <div class="info-item">
                        <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
                        <a href="mailto:andrealeeenyi@gmail.com" style="color:inherit; text-decoration:none;">andrealeeenyi@gmail.com</a>
                    </div>
                    <div class="info-item">
                        <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                        <span>47500 Selangor, Malaysia</span>
                    </div>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/andrea-lee-a60b703b1/" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/andrealeeenyi-byte" target="_blank" rel="noopener" class="social-icon" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </div>
            <div class="animate-fade-up">
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Andrea Lee" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="andrealeeenyi@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-control" placeholder="How can I help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    <div id="form-alert" class="form-alert"></div>
                </form>
            </div>
        </div>
    </div>
</section>
