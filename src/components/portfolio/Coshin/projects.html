<section class="animate-fade-up">

    <div class="title">
        <h1>Projects</h1>
        <p class="subtitle">Pinned &amp; in progress</p>
    </div>

    <div class="pinboard">

        <div class="pin-item">
            <span class="pin-dot" aria-hidden="true"></span>
            <div class="pin-photo">
                <!-- TODO: replace with a screenshot of the portfolio site -->
                <img src="../assets/images/Coshin/portfolio-project.jpg"
                     loading="lazy"
                     alt="Screenshot of this portfolio website">
                <span class="pin-tag">This Portfolio</span>
            </div>
        </div>

        <div class="pin-caption">
            <h2>This Portfolio Website</h2>
            <p>
                <!-- TODO: replace with your own project description -->
                [Describe what this site is built with — vanilla HTML/CSS/JS,
                the bento-grid achievements carousel, responsive breakpoints,
                and dynamic component injection — and what you learned
                building it.]
            </p>
            <a class="solidbutton"
               href="https://github.com/yourusername/your-repo"
               target="_blank" rel="noopener noreferrer">View Code</a>
        </div>

        <!-- Extra pin slots so the board doesn't look empty as you add
             more projects. Delete this block once you have a second
             project, or duplicate the .pin-item + .pin-caption pair
             above and remove pin-placeholder. -->
        <div class="pin-item pin-placeholder">
            <span class="pin-dot" aria-hidden="true"></span>
            <div class="pin-photo">+ Add next project</div>
        </div>

    </div>

</section>
