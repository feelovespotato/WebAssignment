<section id="RyanContact" class="UpFadeInAnimation">
  <span class="RyanContactTitle">LET'S TALK</span>
  <h2>Contact Me</h2>

  <div id="RyanContactGrid">
    <div id="RyanContactInfo">
      <h3>Let's collaborate</h3>
      <p>Feel free to reach out directly or fill out the form.</p>

      <div class="RyanContactItem">
        <span class="RyanContactIcon">✉</span>
        <span>emailname.email@example.com</span>
      </div>

      <div class="RyanContactItem">
        <span class="RyanContactIcon">📍</span>
        <span>Selangor, Malaysia</span>
      </div>

      <div class="RyanContactSocials">
        <a href="#" aria-label="LinkedIn">LIN</a>
        <a href="#" aria-label="GitHub">GH</a>
      </div>
    </div>

    <form id="RyanContactForm">
      <label for="RyanName">Full Name</label>
      <input type="text" id="RyanName" placeholder="Your Name">

      <label for="RyanEmail">Email Address</label>
      <input type="email" id="RyanEmail" placeholder="you@example.com">

      <label for="RyanMessage">Message</label>
      <textarea id="RyanMessage" placeholder="How can I help you?"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</section>
