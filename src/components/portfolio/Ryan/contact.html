<section id="ryan-contact" class="animate-fade-up">
  <span class="ryan-contact-eyebrow">LET'S TALK</span>
  <h2>Contact Me</h2>

  <div id="ryan-contact-grid">
    <div id="ryan-contact-info">
      <h3>Let's collaborate</h3>
      <p>Feel free to reach out directly or fill out the form.</p>

      <div class="ryan-contact-item">
        <span class="ryan-contact-icon">✉</span>
        <span>ryan.email@example.com</span>
      </div>

      <div class="ryan-contact-item">
        <span class="ryan-contact-icon">📍</span>
        <span>Selangor, Malaysia</span>
      </div>

      <div class="ryan-contact-socials">
        <a href="#" aria-label="LinkedIn">in</a>
        <a href="#" aria-label="GitHub">gh</a>
      </div>
    </div>

    <form id="ryan-contact-form">
      <label for="ryan-name">Full Name</label>
      <input type="text" id="ryan-name" placeholder="Your name">

      <label for="ryan-email">Email Address</label>
      <input type="email" id="ryan-email" placeholder="you@example.com">

      <label for="ryan-message">Message</label>
      <textarea id="ryan-message" placeholder="How can I help you?"></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>
</section>
