<section id="ryan-certs" class="animate-fade-up">
  <h2>Certifications</h2>

  <div id="cert-carousel">
    <button class="cert-arrow left" id="prevCert">&#8592;</button>

    <div id="cert-display">
      <img id="cert-frame" src="" alt="">
      <div id="cert-info">

  <div id="cert-dots"></div>
