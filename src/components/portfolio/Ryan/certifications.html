<section id="ryan-certs" class="animate-fade-up">
  <h2>Certifications</h2>

  <div id="cert-carousel">
    <button class="cert-arrow left" id="prevCert">&#8592;</button>

    <div id="cert-display">
      <embed id="cert-frame" src="" type="application/pdf" width="100%" height="500px">
      <div id="cert-info">
        <h3 id="cert-name"></h3>
        <p id="cert-desc"></p>
      </div>
    </div>

    <button class="cert-arrow right" id="nextCert">&#8594;</button>
  </div>

  <div id="cert-dots"></div>
</section>
