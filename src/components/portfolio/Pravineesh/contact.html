<section class="contactSection" id="contact">

    <div class="sectionHeading">

        <p class="sectionLabel">
            Contact
        </p>

        <h2> Get in Touch</h2>

        <p> Contact me machaaaaaa</p>
    </div>

    <div class="layoutContact">
        <div class="informationContact">
            <a href="email"
            class="itemContact">
                <i class="fa-solid fa-envelope"></i>
            <div>
                <span>Email</span>
                <span>pravineesh.sathiswaran@example.com</span>
        </div>
            </a>

            <a href="linkedin"
            class="itemContact">
                <i class="fa-brands fa-linkedin"></i>

                <div>
                <span>LinkedIn</span>
                <span>linkedin.com/in/pravineesh</span>
                </div>
            </a>
        </div>

        <form id="formContact" class="formContact">

            <div class="groupForm">
                <label for="contactName">Name</label>

                <input
                    type="text"
                        id="contactName"
                        name="contactName"
                        placeholder="Enter your name"
                        required>
            </div>

            <div class="groupForm">
                <label for="contactEmail">Email</label>

                <input
                    type="email"
                        id="contactEmail"
                        name="contactEmail"
                        placeholder="Enter your email"
                        required>
            </div>

            <div class="groupForm">
                <label for="contactSubject">Subject</label>

                <input
                    type="text"
                        id="contactSubject"
                        name="contactSubject"
                        placeholder="Enter your subject"
                        required>

            <div class="groupForm">
                <label for="contactMessage">Message</label>

                <textarea
                    id="contactMessage"
                    name="contactMessage"
                    placeholder="Write your message"
                    rows="5"
                    required>
                </textarea>
            </div>

            <button type="submit" class="solidbutton">Send Message</button>
        </form>
    </div>
</section>
