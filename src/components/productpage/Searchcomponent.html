<div class="search-container animate-fade-up">
        <div class="search-input-wrapper">
            <input
                type="text"
                id="search-input"
                placeholder="Search drinks..."
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-owns="search-suggestions"
                aria-autocomplete="list"
            />
            <div class="search-suggestions" id="search-suggestions" role="listbox"></div>
        </div>
         <button class="solidbutton" id="search-button">Search</button>
    </div>
