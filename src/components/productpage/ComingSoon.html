<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coming Soon!</title>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f8f5ef;
            font-family: "Poppins", sans-serif;
        }

        .comingSoon {
            padding: 50px;
            text-align: center;
        }

        .comingSoon h1 {
            margin-bottom: 15px;

            color: #f39a1e;
            font-size: clamp(42px, 7vw, 75px);
        }

        .comingSoon p {
            margin-bottom: 30px;

            color: #555555;
            font-size: 18px;
        }

        .comingSoon a {
            padding: 13px 28px;

            display: inline-block;

            background-color: #f39a1e;
            color: #ffffff;

            border-radius: 50px;

            font-weight: 600;
            text-decoration: none;

            transition:
                background-color 0.3s ease,
                transform 0.3s ease;
        }

        .comingSoon a:hover {
            background-color: #d98300;
            transform: translateY(-3px);
        }

        .comingsoonImage {
    width: 300px;
    max-width: 100%;
    margin-bottom: 25px;
}
    </style>
</head>

<body>

    <main class="comingSoon">

        <h1>Coming Soon!</h1>

        <p>
            Something exciting is coming to you soon.
        </p>

        <a href="/src/pages/HomePage.html">
            Back to Home
        </a>
    </main>

</body>

</html>
