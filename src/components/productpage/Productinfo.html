<div class="detail-info animate-fade-up">
    <p class="category-tag" id="product-category-tag"></p>
    <h1 id="product-title"></h1>
    

    <p class="price" id="product-price"></p>

    <p class="halfvisibletext" id="product-description"></p>

    <div class="option-group">
        <p class="option-label">Size</p>
        <div class="option-pill-container" id="size-pills">
            <!-- generated from product.sizes -->
        </div>
    </div>

    <div class="option-group">
        <p class="option-label">Flavour</p>
        <div id="flavor-pills" class="option-pill-container">
            
        </div>
    </div>

    <div class="option-group">
        <p class="option-label">Pack</p>
        <div class="option-pill-container" id="pack-pills">
            <!-- generated from product.packs -->
        </div>
    </div>

    <div class="purchase-row">
        <div class="quantity-stepper">
            <button type="button" class="hover-pink-highlight" aria-label="Decrease quantity">−</button>
            <span class="quantity-value">1</span>
            <button type="button" class="hover-pink-highlight" aria-label="Increase quantity">+</button>
        </div>
        <button id="add-to-cart-btn" class="solidbutton">Add to Cart</button>
    </div>

    <div class="meta-strip">
        <hr>
        <div class="meta-row">
            <span>Availability</span>
            <span id="product-availability"></span>
        </div>
        <div class="meta-row">
            <span>Delivery</span>
            <span id="product-delivery"></span>
        </div>
        
    </div>
</div>
