<section class="companyContact" id="contact">

    <div class="contactHeading">
        <span>CONTACT US</span>
        <h2>Enquiries</h2>
        <p>Send us a message and our team will get back to you as soon as possible.</p>
    </div>

    <div class="contactContent">

        <!-- Company contact information -->
        <div class="contactInformation">

            <a href="mailto:support@drinks.com" class="contactCard">
                <div class="contactIcon">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div>
                    <h3>Email</h3>
                    <p>support@drinks.com</p>
                </div>
            </a>

            <a href="tel:+60312345678" class="contactCard">
                <div class="contactIcon">
                    <i class="fa-solid fa-phone"></i>
                </div>

                <div>
                    <h3>Phone</h3>
                    <p>+603 1234 5678</p>
                </div>
            </a>

            <div class="contactCard">
                <div class="contactIcon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div>
                    <h3>Address</h3>
                    <p>Selangor, Malaysia</p>
                </div>
            </div>

        </div>

        <!-- Contact form -->
        <form class="companyContactForm" id="contactForm">

            <div class="contactFormGroup">
                <label for="contactName">Name</label>

                <input
                    type="text"
                    id="contactName"
                    name="contactName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="contactFormGroup">
                <label for="contactEmail">Email</label>

                <input
                    type="email"
                    id="contactEmail"
                    name="contactEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="contactFormGroup">
                <label for="contactSubject">Subject</label>

                <input
                    type="text"
                    id="contactSubject"
                    name="contactSubject"
                    placeholder="Enter your subject"
                    required
                >
            </div>

            <div class="contactFormGroup">
                <label for="contactMessage">Message</label>

                <textarea
                    id="contactMessage"
                    name="contactMessage"
                    placeholder="Enter your message"
                    rows="6"
                    required
                ></textarea>
            </div>

            <button type="submit" class="contactSubmitButton" id="contactSubmitButton">
                Send Message
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        <p id="contactFormMessage" class="contactFormMessage"></p>

        </form>

    </div>

</section>
