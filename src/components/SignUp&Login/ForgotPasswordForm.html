<section class="forgotContainer">
    <div class="forgotCard">
        <header class="forgotHeader">

            <div class="resetIcon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1> Reset Your Password</h1>

            <p> Please enter the email address associated with your Pokka account.</p>
        </header>

        <section
            id="emailstep"
            class="resetstep">
        
            <div class="stepindicator">
                Step 1/2
            </div>

            <form id="emailValidationForm">
                <label for="emailReset">
                    Email Address
                </label>

                <input
                type="email"
                id="emailReset"
                name="emailReset"
                placeholder="Enter your email address"
                autocomplete="email"
                required>

                <p
                id="emailMessage"
                class="formMessage"
                aria-live="polite"></p>

                <button
                type="submit"
                class="buttonReset">
                Validate Email
            </button>
            </form>

            <a href="LoginPage.html" class="returnToLogin">
                <i class=" fa-solid fa-arrow-left"></i>
                Back to Login Page
            </a>
   </section>
        
    <section
        id="passwordstep"
        class="resetstep hidden">
    
        <div class="stepindicator">
            Step 2/2
        </div>

        <p class="accountMessage">
            Resetting the password for:
            <strong id="validatedEmail"></strong>
        </p>

        <form id="passwordResetForm">

            <label for="newPassword">
                New Password
            </label>

            <div class="passwordContainer">

                <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Please enter a new password"
                autocomplete="new-password"
                required>
            </div>
        </form>
    </section>
     
    </div>
</section>
